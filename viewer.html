<body>
    <header>
        <h1>Book Swap SA</h1>
        <p>PRP372S — Digital Portfolio</p>
    </header>

    <main>
        <a class="back" href="./">← Back to Portfolio Home</a>
        <article id="content">Loading portfolio artefact...</article>
    </main>

    <footer>Book Swap SA | CPUT | 2026</footer>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        const files = {
            "charter": "charter.md",
            "stories": "user-stories.md",
            "product": "product-backlog.md",
            "sprint": "sprint-backlog.md",
            "logbook": "agile-logbook.md"
        };

        const params = new URLSearchParams(window.location.search);
        const key = params.get("file");
        const filename = files[key];
        const content = document.getElementById("content");

        if (!filename) {
            content.innerHTML =
                "<h2>Artefact not found</h2><p>Please return to the portfolio homepage and select an artefact.</p>";
        } else {
            document.title = "Book Swap SA | " + filename;

            fetch(filename)
                .then(response => {
                    if (!response.ok) {
                        throw new Error("Could not load " + filename);
                    }
                    return response.text();
                })
                .then(markdown => {
                    content.innerHTML = marked.parse(markdown);
                })
                .catch(() => {
                    content.innerHTML =
                        "<h2>Unable to load artefact</h2>" +
                        "<p>Please refresh the page and try again.</p>" +
                        "<p><a href='./'>Return to Portfolio Home</a></p>";
                });
        }
    </script>
</body>
</html>
